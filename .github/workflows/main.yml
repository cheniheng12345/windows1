name: name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download RustDesk portable
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"

      - name: Create config file in correct location
        run: |
          # 创建配置目录（如果不存在）
          $configDir = "$env:APPDATA\RustDesk\config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          # 写入固定密码
          Set-Content -Path "$configDir\RustDesk.toml" -Value 'password = "Cyh65432"' -Encoding utf8
          Write-Host "Config file created at $configDir\RustDesk.toml"
          # 验证文件已创建
          Get-Content "$configDir\RustDesk.toml"

      - name: Run RustDesk portable
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Write-Host "RustDesk started with fixed password: Cyh65432"
          Start-Sleep -Seconds 15

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      - name: Keep runner alive forever
        run: |
          Write-Host "========================================"
          Write-Host "RustDesk is running with fixed password: Cyh65432"
          Write-Host "Workflow will run continuously until manually cancelled."
          Write-Host "Download the screenshot from Artifacts to see the ID."
          Write-Host "========================================"
          while ($true) { Start-Sleep -Seconds 60 }
