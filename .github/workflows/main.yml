- name: Download AnyDesk installer
  run: |
    # 下载并重命名安装文件
    Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk_Setup.exe"
    Write-Host "AnyDesk installer downloaded."

- name: Install AnyDesk silently (standard method)
  run: |
    $installerPath = "$env:TEMP\AnyDesk_Setup.exe"
    $installPath = "${env:ProgramFiles(x86)}\AnyDesk"
    # 核心修改：使用标准静默安装参数（这会确保它在后台安装，不会弹出任何窗口或对话框）
    Start-Process -FilePath $installerPath -ArgumentList "--install `"$installPath`" --start-with-win --create-shortcuts --create-desktop-icon --silent" -Wait -NoNewWindow
    Write-Host "AnyDesk installation triggered."

- name: Wait and set fixed password (UncleLu0)
  run: |
    # 等待安装和初始化完成
    Write-Host "Waiting for installation to finalize..."
    Start-Sleep -Seconds 15

    $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
    if (-not (Test-Path $anydeskPath)) {
        Write-Host "ERROR: AnyDesk.exe not found at expected path!"
        exit 1
    }

    # 尝试设置密码
    Write-Host "Setting fixed password (UncleLu0)..."
    $password = "UncleLu0"
    # 通过标准输入将密码传递给 --set-password 命令
    echo $password | & $anydeskPath --set-password
    if ($LASTEXITCODE -eq 0) {
        Write-Host "Password successfully set to '$password'."
        # 验证密码是否已写入注册表或配置文件（可选，但有助于排查）
    } else {
        Write-Host "WARNING: Password setting may have failed with exit code $LASTEXITCODE."
    }

    # 配置注册表以彻底避免远程连接提示
    Write-Host "Configuring registry to avoid connection prompts..."
    # 确保 AnyDesk 的注册表项存在
    New-Item -Path "HKLM:\SOFTWARE\AnyDesk" -Force | Out-Null
    # 设置 Interactive Access 为完全禁用 (Value 2)
    Set-ItemProperty -Path "HKLM:\SOFTWARE\AnyDesk" -Name "ad.security.interactive_access" -Value 2 -Type DWord -Force
    Write-Host "Registry configured to disable interactive access prompts."

- name: Start AnyDesk Service and Client
  run: |
    $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
    # 启动后台服务
    Write-Host "Starting AnyDesk service..."
    Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
    # 启动客户端主界面，用于生成并显示ID
    Write-Host "Launching AnyDesk client..."
    Start-Process -FilePath $anydeskPath
    Start-Sleep -Seconds 15
    Write-Host "AnyDesk is ready for connection."
