name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download RustDesk portable
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"

      - name: Run RustDesk portable (background)
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Write-Host "RustDesk started. Waiting 90 seconds for ID and password..."
          Start-Sleep -Seconds 90

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot (attempt to capture password)
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      # 无限循环，保持 runner 活跃，让 RustDesk 持续运行
      - name: Keep runner alive forever
        run: |
          Write-Host "Entering infinite loop to keep workflow running..."
          while ($true) { Start-Sleep -Seconds 60 }
