name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk installer
        run: |
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk_Setup.exe"

      - name: Install AnyDesk silently
        run: |
          $installer = "$env:TEMP\AnyDesk_Setup.exe"
          $installPath = "${env:ProgramFiles(x86)}\AnyDesk"
          Start-Process -FilePath $installer -ArgumentList "--install `"$installPath`" --start-with-win --create-shortcuts --create-desktop-icon --silent" -Wait -NoNewWindow
          Start-Sleep -Seconds 10

      - name: Set password and disable prompt
        run: |
          $anydesk = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $anydesk)) { $anydesk = "$env:ProgramFiles\AnyDesk\AnyDesk.exe" }
          echo "UncleLu0" | & $anydesk --set-password
          New-Item -Path "HKLM:\SOFTWARE\AnyDesk" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\AnyDesk" -Name "ad.security.interactive_access" -Value 2 -Type DWord -Force

      - name: Start AnyDesk service and client
        run: |
          $anydesk = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $anydesk)) { $anydesk = "$env:ProgramFiles\AnyDesk\AnyDesk.exe" }
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
          Start-Process -FilePath $anydesk
          Start-Sleep -Seconds 15

      - name: Take screenshot
        run: |
          pip install pyautogui pillow
          python -c "import pyautogui, time; time.sleep(5); pyautogui.screenshot('AnyDesk_ID.png')"

      - name: Upload screenshot to Imgur (optional)
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
        run: |
          $clientId = "$env:IMGUR_CLIENT_ID"
          if (-not $clientId) { Write-Host "No Imgur client ID, skipping upload"; exit 0 }
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("AnyDesk_ID.png"))
          $body = @{ image = $base64; type = "base64" } | ConvertTo-Json
          $response = Invoke-RestMethod -Uri "https://api.imgur.com/3/image" -Method Post -Headers @{ Authorization = "Client-ID $clientId" } -Body $body -ContentType "application/json"
          Write-Host "Screenshot URL: $($response.data.link)"
          Write-Host "Password: UncleLu0"

      - name: Fallback upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: AnyDesk_ID.png

      - name: Keep runner alive
        run: while ($true) { Start-Sleep -Seconds 60 }
