name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/uncle-luo/win11rdp/-/raw/main/down.bat" -OutFile "down.bat"
          cmd /c down.bat

      - name: Download & run RustDesk
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Start-Sleep -Seconds 15

      - name: Install tools
        run: pip install pyautogui pillow requests

      - name: Screenshot + upload to catbox.moe
        run: |
          python -c "import pyautogui, time, requests, io; time.sleep(5); img = pyautogui.screenshot(); b = io.BytesIO(); img.save(b, 'PNG'); r = requests.post('https://catbox.moe/user/api.php', files={'fileToUpload': ('s.png', b.getvalue(), 'image/png')}, data={'reqtype': 'fileupload'}); print('========================================'); print('Screenshot URL:', r.text); print('========================================')"

      - name: Keep alive
        run: cmd /c loop.bat
