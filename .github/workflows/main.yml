name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk installer
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $out = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "AnyDesk installer downloaded"

      - name: Install AnyDesk silently
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"
          Start-Process -FilePath $installer -ArgumentList "--silent" -Wait -NoNewWindow
          Start-Sleep -Seconds 10
          Write-Host "AnyDesk installed"

      - name: Find AnyDesk executable
        id: find
        run: |
          $paths = @(
            "$env:ProgramFiles\AnyDesk\AnyDesk.exe",
            "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          )
          $found = $null
          foreach ($p in $paths) {
            if (Test-Path $p) {
              $found = $p
              break
            }
          }
          if (-not $found) {
            Write-Host "AnyDesk not found"
            exit 1
          }
          Write-Host "AnyDesk path: $found"
          echo "ANYDESK_PATH=$found" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start AnyDesk (generate one-time password)
        run: |
          Start-Process -FilePath "$env:ANYDESK_PATH"
          Write-Host "AnyDesk started. Waiting 60 seconds for ID and one-time password generation..."
          Start-Sleep -Seconds 60

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('anydesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: anydesk_id.png

      - name: Show connection info
        run: |
          Write-Host "==========================================="
          Write-Host "AnyDesk is running on GitHub Actions runner."
          Write-Host "Download the artifact 'anydesk-screenshot' to view the ID and one-time password."
          Write-Host "The password is usually a 6-digit number displayed in the AnyDesk window."
          Write-Host "Workflow will stay alive until manually cancelled."
          Write-Host "==========================================="

      - name: Keep runner alive forever
        run: while ($true) { Start-Sleep -Seconds 60 }
