name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 原有的下载和安装环境（Telegram、WinRAR 等）
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/uncle-luo/win11rdp/-/raw/main/down.bat" -OutFile "down.bat"
          cmd /c down.bat

      # 原有的 LiteManager 连接（可选，失败不中断）
      - name: Connect to LiteManager
        run: cmd /c show.bat
        continue-on-error: true

      # ========== RustDesk 部分 ==========
      - name: Download RustDesk installer
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"

      - name: Install RustDesk (system level)
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--silent-install" -Wait
          Write-Host "RustDesk installed successfully."

      - name: Start RustDesk and wait for password generation
        run: |
          Start-Process -FilePath "$env:ProgramFiles\RustDesk\rustdesk.exe"
          Write-Host "Waiting 120 seconds for password to generate..."
          Start-Sleep -Seconds 120

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      # ========== 保持运行（原有 loop.bat 无限循环）==========
      - name: Time Counter
        run: cmd /c loop.bat
