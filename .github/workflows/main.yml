name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download RustDesk portable
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $out = "$env:TEMP\rustdesk.exe"
          if (Test-Path $out) { Remove-Item $out -Force }
          $retry = 0
          do {
            try {
              Write-Host "Downloading attempt $($retry+1)..."
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              $size = (Get-Item $out).Length
              if ($size -gt 5MB) {
                Write-Host "Download success: $([math]::Round($size/1MB,2)) MB"
                break
              } else {
                Remove-Item $out -Force
              }
            } catch { Write-Host "Failed: $_" }
            $retry++; Start-Sleep 3
          } while ($retry -lt 3)
          if ((Get-Item $out).Length -lt 5MB) { throw "Download failed" }

      - name: Start RustDesk portable
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Start-Sleep -Seconds 10

      - name: Click Install button (base64 encoded script)
        run: |
          $scriptBase64 = ""
          $scriptBytes = [System.Convert]::FromBase64String($scriptBase64)
          $scriptPath = "$env:TEMP\click.py"
          [System.IO.File]::WriteAllBytes($scriptPath, $scriptBytes)
          pip install pyautogui pillow
          python $scriptPath

      - name: Wait for password
        run: Start-Sleep -Seconds 60

      - name: Take screenshot
        run: |
          pip install pyautogui pillow
          python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      - name: Keep runner alive forever
        run: while ($true) { Start-Sleep -Seconds 60 }
