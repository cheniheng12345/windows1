name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/uncle-luo/win11rdp/-/raw/main/down.bat" -OutFile "down.bat"
          cmd /c down.bat

      # === 安装和运行 Rust Desk ===
      - name: Download and run Rust Desk
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Start-Sleep -Seconds 15

      # === 安装截图依赖 ===
      - name: Install screenshot tools
        run: pip install pyautogui pillow requests

      # === 截图并上传到图床 ===
      - name: Take screenshot and upload
        run: |
          python -c "
import pyautogui
import requests
import base64
import time
from io import BytesIO

time.sleep(5)

screenshot = pyautogui.screenshot()
buffered = BytesIO()
screenshot.save(buffered, format='PNG')
img_base64 = base64.b64encode(buffered.getvalue()).decode()

# 使用 catbox.moe 图床（无需 API key）
files = {'fileToUpload': ('screenshot.png', buffered.getvalue(), 'image/png')}
data = {'reqtype': 'fileupload'}
response = requests.post('https://catbox.moe/user/api.php', files=files, data=data)

if response.status_code == 200:
    print('Screenshot uploaded successfully:')
    print(response.text)
    # 保存 URL 到文件
    with open('screenshot_url.txt', 'w') as f:
        f.write(response.text)
else:
    print(f'Upload failed: {response.status_code}')
    print(response.text)
    screenshot.save('rustdesk_id.png')
    print('Screenshot saved locally as rustdesk_id.png')
"

      # === 显示上传结果 ===
      - name: Show upload result
        run: |
          if (Test-Path "screenshot_url.txt") {
            $url = Get-Content "screenshot_url.txt"
            Write-Host "========================================="
            Write-Host "Rust Desk screenshot uploaded!"
            Write-Host "Download URL: $url"
            Write-Host "========================================="
          } else {
            Write-Host "Screenshot saved locally (upload failed)"
          }

      # === 保持运行 ===
      - name: Time Counter
        run: cmd /c loop.bat
