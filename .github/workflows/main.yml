name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # === 原有的安装环境（Telegram、WinRAR 等）===
      - name: Downloading & Installing Essentials
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/uncle-luo/win11rdp/-/raw/main/down.bat" -OutFile "down.bat"
          cmd /c down.bat

      # === 原有的 LiteManager 连接（失败不中断）===
      - name: Connect to LiteManager
        run: cmd /c show.bat
        continue-on-error: true

      # === RustDesk 便携版下载（带重试和完整性检查）===
      - name: Download RustDesk portable (with retry)
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $out = "$env:TEMP\rustdesk.exe"
          if (Test-Path $out) { Remove-Item $out -Force }
          $retry = 0
          do {
            try {
              Write-Host "Downloading from $url (attempt $($retry+1))..."
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              $size = (Get-Item $out).Length
              if ($size -gt 5MB) {
                Write-Host "Download successful. Size: $([math]::Round($size/1MB, 2)) MB"
                break
              } else {
                Write-Host "File too small ($size bytes), retrying..."
                Remove-Item $out -Force
              }
            } catch {
              Write-Host "Download failed: $_"
            }
            $retry++
            Start-Sleep -Seconds 3
          } while ($retry -lt 3)
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 5MB) {
            throw "Failed to download valid rustdesk.exe"
          }

      # === 启动 RustDesk 便携版 ===
      - name: Run RustDesk portable
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Start-Sleep -Seconds 15

      # === 安装截图工具 ===
      - name: Install screenshot tools
        run: pip install pyautogui pillow

      # === 截图（等待5秒后截屏）===
      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(5); pyautogui.screenshot('rustdesk_id.png')"

      # === 上传截图作为 Artifact ===
      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      # === PowerShell 无限循环，保持工作流活跃 ===
      - name: Keep runner alive forever
        run: |
          Write-Host "========================================"
          Write-Host "LiteManager and RustDesk are running."
          Write-Host "Workflow will run continuously until manually cancelled."
          Write-Host "Download the screenshot from Artifacts to see RustDesk ID and password."
          Write-Host "========================================"
          while ($true) { Start-Sleep -Seconds 60 }
