name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk portable
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $out = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "AnyDesk portable downloaded to $out"

      - name: Install AnyDesk service (unattended)
        run: |
          $anydesk = "$env:TEMP\AnyDesk.exe"
          # 安装后台服务（需要管理员权限，GitHub Actions 默认拥有）
          Start-Process -FilePath $anydesk -ArgumentList "--install-service" -Wait -NoNewWindow
          Write-Host "AnyDesk service installed"
          Start-Sleep -Seconds 5

      - name: Set fixed password (Cyh65432)
        run: |
          $anydesk = "$env:TEMP\AnyDesk.exe"
          # 通过标准输入设置密码
          echo "Cyh65432" | & $anydesk --set-password
          Write-Host "Unattended password set to Cyh65432"

      - name: Start AnyDesk service and client
        run: |
          # 确保服务已启动
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
          # 启动主界面（显示ID和状态）
          $anydesk = "$env:TEMP\AnyDesk.exe"
          Start-Process -FilePath $anydesk
          Write-Host "AnyDesk client started"
          Start-Sleep -Seconds 15

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('anydesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: anydesk_id.png

      - name: Keep runner alive forever
        run: |
          Write-Host "========================================"
          Write-Host "AnyDesk portable with service installed."
          Write-Host "Password: Cyh65432"
          Write-Host "Download screenshot from Artifacts to see the 9-digit ID."
          Write-Host "Workflow will run until manually cancelled."
          Write-Host "========================================"
          while ($true) { Start-Sleep -Seconds 60 }
