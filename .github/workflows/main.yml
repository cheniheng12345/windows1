name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download & run essentials (optional)
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/uncle-luo/win11rdp/-/raw/main/down.bat" -OutFile "down.bat"
          cmd /c down.bat
        continue-on-error: true

      - name: Download RustDesk portable (with proxy)
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $proxyUrl = "https://ghproxy.com/" + $url
          Write-Host "Downloading from proxy..."
          curl -L --retry 5 --retry-delay 2 -o "$env:TEMP\rustdesk.exe" $proxyUrl
          Write-Host "Download completed."

      - name: Run RustDesk portable
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--portable"
          Start-Sleep -Seconds 10

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(5); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      - name: Keep alive (optional)
        run: cmd /c loop.bat
        continue-on-error: true
