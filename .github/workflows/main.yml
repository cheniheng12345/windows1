name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk installer
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\AnyDesk_Setup.exe"

      - name: Silent install AnyDesk
        run: |
          Start-Process -FilePath "$env:TEMP\AnyDesk_Setup.exe" -ArgumentList "--silent" -Wait
          Start-Sleep -Seconds 10

      - name: Set fixed password (UncleLu0)
        run: |
          $anydesk = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $anydesk)) { $anydesk = "$env:ProgramFiles\AnyDesk\AnyDesk.exe" }
          # 设置无人值守密码
          echo "UncleLu0" | & $anydesk --set-password
          # 启用无人值守（通过注册表禁止弹窗）
          New-Item -Path "HKLM:\SOFTWARE\AnyDesk" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\AnyDesk" -Name "ad.security.interactive_access" -Value 2 -Type DWord -Force
          Write-Host "Password set to UncleLu0"

      - name: Start AnyDesk service and client
        run: |
          $anydesk = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $anydesk)) { $anydesk = "$env:ProgramFiles\AnyDesk\AnyDesk.exe" }
          Start-Service -Name "AnyDesk" -ErrorAction SilentlyContinue
          Start-Process -FilePath $anydesk
          Start-Sleep -Seconds 15

      - name: Take screenshot
        run: |
          pip install pyautogui pillow
          python -c "import pyautogui, time; time.sleep(5); pyautogui.screenshot('AnyDesk_ID.png')"

      - name: Upload screenshot to Imgur
        env:
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
        run: |
          $clientId = "$env:IMGUR_CLIENT_ID"
          if (-not $clientId) { Write-Host "No Imgur client ID, saving locally"; exit 0 }
          $url = "https://api.imgur.com/3/image"
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes("AnyDesk_ID.png"))
          $body = @{ image = $base64; type = "base64" } | ConvertTo-Json
          $response = Invoke-RestMethod -Uri $url -Method Post -Headers @{ Authorization = "Client-ID $clientId" } -Body $body -ContentType "application/json"
          $link = $response.data.link
          Write-Host "========================================"
          Write-Host "AnyDesk ID and password screenshot: $link"
          Write-Host "Password: UncleLu0"
          Write-Host "========================================"
          # 保存链接以便后续使用
          $link | Out-File -FilePath screenshot_url.txt

      - name: Fallback upload screenshot as artifact
        if: failure() || env.IMGUR_CLIENT_ID == ''
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: AnyDesk_ID.png

      - name: Keep runner alive forever
        run: |
          Write-Host "AnyDesk ready - ID in screenshot, password: UncleLu0"
          while ($true) { Start-Sleep -Seconds 60 }
