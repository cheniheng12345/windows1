name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download RustDesk installer
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.3/rustdesk-1.2.3-x86_64.exe"
          $out = "$env:TEMP\rustdesk_installer.exe"
          $retry = 0
          do {
            try {
              Write-Host "Download attempt $($retry+1)..."
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              $size = (Get-Item $out).Length
              if ($size -gt 5MB) {
                Write-Host "Downloaded $([math]::Round($size/1MB,2)) MB"
                break
              } else {
                Remove-Item $out -Force
              }
            } catch { Write-Host "Failed: $_" }
            $retry++; Start-Sleep 3
          } while ($retry -lt 3)
          if ((Get-Item $out).Length -lt 5MB) { throw "Download failed" }

      - name: Install RustDesk silently
        run: |
          Write-Host "Installing RustDesk silently..."
          $installer = "$env:TEMP\rustdesk_installer.exe"
          # 尝试静默安装参数（NSIS常用/S，InnoSetup常用/VERYSILENT）
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait -NoNewWindow
          # 等待安装完成
          Start-Sleep -Seconds 10
          Write-Host "Installation completed."

      - name: Start RustDesk and wait for password
        run: |
          $rustdeskPath = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskPath)) {
            $rustdeskPath = "${env:ProgramFiles(x86)}\RustDesk\rustdesk.exe"
          }
          if (Test-Path $rustdeskPath) {
            Start-Process -FilePath $rustdeskPath
            Write-Host "RustDesk started. Waiting 90 seconds for password generation..."
            Start-Sleep -Seconds 90
          } else {
            Write-Host "RustDesk executable not found!"
            exit 1
          }

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('rustdesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-screenshot
          path: rustdesk_id.png

      - name: Keep runner alive forever
        run: |
          Write-Host "========================================"
          Write-Host "RustDesk installed and running."
          Write-Host "Download screenshot from Artifacts to see ID and password."
          Write-Host "Workflow will run continuously until cancelled."
          Write-Host "========================================"
          while ($true) { Start-Sleep -Seconds 60 }
