name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk portable
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $out = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "AnyDesk portable downloaded"

      - name: Create config for unattended access
        run: |
          $configDir = "$env:TEMP\AnyDesk_config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $configFile = "$configDir\service.conf"
          # 逐行写入配置（避免多行字符串）
          Set-Content -Path $configFile -Value "[options]"
          Add-Content -Path $configFile -Value "enable_unattended=1"
          Add-Content -Path $configFile -Value ""
          Add-Content -Path $configFile -Value "[auth]"
          Add-Content -Path $configFile -Value "password=Cyh65432"
          Write-Host "Unattended config created at $configFile"

      - name: Run AnyDesk with unattended config
        run: |
          $anydesk = "$env:TEMP\AnyDesk.exe"
          $configDir = "$env:TEMP\AnyDesk_config"
          # 启动后台服务
          Start-Process -FilePath $anydesk -ArgumentList "--set-config-dir `"$configDir`" --service"
          Start-Sleep -Seconds 5
          # 启动主界面
          Start-Process -FilePath $anydesk -ArgumentList "--set-config-dir `"$configDir`""
          Write-Host "AnyDesk started with unattended access. Password: Cyh65432"
          Start-Sleep -Seconds 30

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('anydesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: anydesk_id.png

      - name: Keep runner alive forever
        run: |
          Write-Host "AnyDesk is running with unattended access (password: Cyh65432)"
          Write-Host "Download screenshot from Artifacts to see the ID"
          while ($true) { Start-Sleep -Seconds 60 }
