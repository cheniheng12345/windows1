name: Wendaoshi-2k2
on:
  workflow_dispatch:
jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 9999
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download AnyDesk portable
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $out = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Write-Host "AnyDesk downloaded"

      - name: Run AnyDesk (generate one‑time password)
        run: |
          Start-Process -FilePath "$env:TEMP\AnyDesk.exe"
          Write-Host "AnyDesk started. Waiting 60 seconds for ID and password..."
          Start-Sleep -Seconds 60

      - name: Install screenshot tools
        run: pip install pyautogui pillow

      - name: Take screenshot
        run: python -c "import pyautogui, time; time.sleep(3); pyautogui.screenshot('anydesk_id.png')"

      - name: Upload screenshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: anydesk-screenshot
          path: anydesk_id.png

      - name: Keep runner alive forever
        run: |
          Write-Host "========================================"
          Write-Host "AnyDesk is running with a one‑time password."
          Write-Host "Download the artifact 'anydesk-screenshot' to see the 9‑digit ID and the 6‑digit password."
          Write-Host "Workflow will run until you cancel it manually."
          Write-Host "========================================"
          while ($true) { Start-Sleep -Seconds 60 }
